[HEADER]
VERSION=1
POWER_CURVE=power.lut			; power curve file
COAST_CURVE=FROM_COAST_REF 		; coast curve

[ENGINE_DATA]
ALTITUDE_SENSITIVITY=0.1		; sensitivity to altitude
INERTIA=0.120					; engine inertia
LIMITER=6500					; engine rev limiter. 0 no limiter
MINIMUM=1250

[COAST_REF]
RPM=7000						; rev number reference
TORQUE=60						; engine braking torque value in Nm at rev number reference

[TURBO_0]
LAG_DN=0.99				; Interpolation lag used slowing down the turbo
LAG_UP=0.997			; Interpolation lag used to spin up the turbo
MAX_BOOST=1.38 			; Maximum boost generated
WASTEGATE=1.10			; Max level of boost before the wastegate does its things
DISPLAY_MAX_BOOST=1.10	; Value used by display apps
REFERENCE_RPM=2200		; Reference rpm where the turbo reaches maximum boost
GAMMA=2.5
COCKPIT_ADJUSTABLE=0

[DAMAGE]
TURBO_BOOST_THRESHOLD=1.40  ; level of TOTAL boost before the engine starts to take damage
TURBO_DAMAGE_K=5		; amount of damage per second per (boost - threshold)
RPM_THRESHOLD=6700		; RPM at which the engine starts to take damage
RPM_DAMAGE_K=1
