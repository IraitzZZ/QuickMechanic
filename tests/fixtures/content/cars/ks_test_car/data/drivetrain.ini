[HEADER]
VERSION=3

[TRACTION]
TYPE=RWD					; Wheel drive. Possible options: FWD, RWD

[GEARS]
COUNT=6				; forward gears number
GEAR_R=-3.500				; rear gear ratio
; forward gears ratios. must be equal to number of gears defined on count
GEAR_1=3.818		
GEAR_2=2.158		
GEAR_3=1.475		
GEAR_4=1.067		
GEAR_5=0.875
GEAR_6=0.744
FINAL=4.176		; final gear ratio

[DIFFERENTIAL]
POWER=0.30			; differential lock under power
COAST=0.45			; differential lock under coasting
PRELOAD=10			; preload torque setting

[GEARBOX]
CHANGE_UP_TIME=240		; change up time in milliseconds
CHANGE_DN_TIME=270		; change down time in milliseconds
SUPPORTS_SHIFTER=1		; 1=Car supports shifter

[CLUTCH]
MAX_TORQUE=450
